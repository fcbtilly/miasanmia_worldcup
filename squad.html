<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>FIFA 2026 북중미 월드컵 선수 명단</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Barlow+Condensed:wght@400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: #e0ddd5;
    --border-dark: #c8c4b8;
    --text-primary: #1a1917;
    --text-secondary: #6b6860;
    --text-muted: #9e9b92;
    --header-bg: #1a1917;
    --accent: #1a3a6b;

    /* 팀 컬러 */
    --germany-bg: #fdf6c0;
    --germany-border: #e0cc50;
    --germany-text: #7a6400;
    --germany-header: #c8a800;

    --france-bg: #c8d4ee;
    --france-border: #7a8fc8;
    --france-text: #1a2d6b;

    --england-bg: #b8e4f9;
    --england-border: #5bbce4;
    --england-text: #0a527a;

    --korea-bg: #fce0e0;
    --korea-border: #e8a0a0;
    --korea-text: #a02020;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 32px 24px;
  }

  /* ── 헤더 ── */
  .page-header {
    max-width: 1100px;
    margin: 0 auto 28px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .page-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text-primary);
    line-height: 1;
  }

  .page-title span { color: var(--accent); }

  .page-sub {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .nav-btns { display: flex; gap: 8px; flex-wrap: wrap; }

  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: var(--header-bg);
    color: #fff;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    font-weight: 500;
    text-decoration: none;
    border-radius: 4px;
    white-space: nowrap;
  }

  /* ── 팀 탭 ── */
  .team-tabs {
    max-width: 1100px;
    margin: 0 auto 20px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .team-tab {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 700;
    padding: 7px 18px;
    border-radius: 4px;
    border: 2px solid transparent;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.15s ease;
    background: var(--surface);
    color: var(--text-muted);
    border-color: var(--border-dark);
  }

  .team-tab:hover { color: var(--text-primary); border-color: var(--border-dark); }

  .team-tab.active-germany {
    background: var(--germany-bg);
    color: var(--germany-text);
    border-color: var(--germany-border);
  }

  .team-tab.active-france {
    background: var(--france-bg);
    color: var(--france-text);
    border-color: var(--france-border);
  }

  .team-tab.active-england {
    background: var(--england-bg);
    color: var(--england-text);
    border-color: var(--england-border);
  }

  .team-tab.active-korea {
    background: var(--korea-bg);
    color: var(--korea-text);
    border-color: var(--korea-border);
  }

  .team-tab.inactive-france,
  .team-tab.inactive-england,
  .team-tab.inactive-korea {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .team-tab.inactive-france:hover  { color: var(--text-muted); border-color: var(--border-dark); }
  .team-tab.inactive-england:hover { color: var(--text-muted); border-color: var(--border-dark); }
  .team-tab.inactive-korea:hover   { color: var(--text-muted); border-color: var(--border-dark); }

  .coming-badge {
    font-size: 9px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 400;
    letter-spacing: 0;
    vertical-align: middle;
    margin-left: 4px;
    color: var(--text-muted);
  }

  /* ── 팀별 포지션 헤더 색상 ── */
  .team-germany .position-header { border-bottom-color: var(--germany-border); }
  .team-germany .position-badge  { background: var(--germany-bg); color: var(--germany-text); border-color: var(--germany-border); }
  .team-germany .player-card:hover { border-color: var(--germany-border); box-shadow: 0 2px 8px rgba(200,168,0,0.12); }
  .team-germany .player-name-link:hover { color: var(--germany-text); }
  .team-germany .age-chip { color: var(--germany-text); }

  .team-korea .position-header { border-bottom-color: var(--korea-border); }
  .team-korea .position-badge  { background: var(--korea-bg); color: var(--korea-text); border-color: var(--korea-border); }
  .team-korea .player-card:hover { border-color: var(--korea-border); box-shadow: 0 2px 8px rgba(232,160,160,0.18); }
  .team-korea .player-name-link:hover { color: var(--korea-text); }
  .team-korea .age-chip { color: var(--korea-text); }

  .team-england .position-header { border-bottom-color: var(--england-border); }
  .team-england .position-badge  { background: var(--england-bg); color: var(--england-text); border-color: var(--england-border); }
  .team-england .player-card:hover { border-color: var(--england-border); box-shadow: 0 2px 8px rgba(91,188,228,0.18); }
  .team-england .player-name-link:hover { color: var(--england-text); }
  .team-england .age-chip { color: var(--england-text); }

  .team-france .position-header { border-bottom-color: var(--france-border); }
  .team-france .position-badge  { background: var(--france-bg); color: var(--france-text); border-color: var(--france-border); }
  .team-france .player-card:hover { border-color: var(--france-border); box-shadow: 0 2px 8px rgba(122,143,200,0.15); }
  .team-france .player-name-link:hover { color: var(--france-text); }
  .team-france .age-chip { color: var(--france-text); }

  /* ── 포지션 섹션 ── */
  .squad-wrapper { max-width: 1100px; margin: 0 auto; display: none; }
  .squad-wrapper.active { display: block; }

  .position-section { margin-bottom: 24px; }

  .position-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    padding-bottom: 7px;
    border-bottom: 2px solid var(--border-dark);
  }

  .position-badge {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 3px 10px;
    border-radius: 3px;
    background: var(--bg);
    color: var(--text-secondary);
    border: 1px solid var(--border-dark);
  }

  .position-count {
    font-size: 11px;
    color: var(--text-muted);
  }

  /* ── 선수 카드 그리드 ── */
  .players-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .player-card {
    background: var(--surface);
    border: 1px solid var(--border-dark);
    border-radius: 5px;
    padding: 11px 13px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .player-card:hover {
    border-color: var(--border-dark);
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .player-name-link {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-primary);
    text-decoration: none;
    line-height: 1.2;
    transition: color 0.12s;
  }

  .player-name-link:hover { color: var(--accent); text-decoration: underline; }

  .player-club {
    font-size: 11px;
    color: var(--text-secondary);
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .player-meta {
    display: flex;
    gap: 8px;
    margin-top: 2px;
  }

  .meta-chip {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }

  .meta-chip span {
    font-size: 10px;
    font-weight: 400;
    color: var(--text-muted);
    margin-right: 1px;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .meta-chip.age-chip { color: var(--text-secondary); }

  /* ── 안내 문구 ── */
  .summary-bar {
    max-width: 1100px;
    margin: 0 auto 14px;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.03em;
  }

  /* ── 클럽 승선 현황 ── */
  .club-stats {
    max-width: 1100px;
    margin: 28px auto 0;
    border-top: 2px solid var(--border-dark);
    padding-top: 16px;
  }

  .club-stats-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .club-stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 7px;
  }

  .club-stat-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 7px 11px;
    gap: 8px;
  }

  .club-stat-name {
    font-size: 12px;
    color: var(--text-primary);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .club-stat-count {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    flex-shrink: 0;
    min-width: 22px;
    text-align: right;
  }

  @media (max-width: 700px) {
    .club-stats-grid { grid-template-columns: repeat(2, 1fr); }
    .club-stat-name { font-size: 11px; }
  }

  /* ── 모바일 ── */
  @media (max-width: 700px) {
    body { padding: 16px 14px; }
    .page-title { font-size: 26px; }
    .players-grid { grid-template-columns: repeat(2, 1fr); gap: 7px; }
    .player-card { padding: 9px 11px; }
    .player-name-link { font-size: 12.5px; }
    .player-club { font-size: 10.5px; }
  }

  @media (min-width: 701px) and (max-width: 960px) {
    .players-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>

function naverSearch(name) {
  return `https://search.naver.com/search.naver?query=${encodeURIComponent(name)}`;
}

function renderGrid(gridId, players) {
  const grid = document.getElementById(gridId);
  if (!grid) return;
  grid.innerHTML = '';
  players.forEach(p => {
    const card = document.createElement('div');
    card.className = 'player-card';
    card.innerHTML = `
      <a class="player-name-link" href="${naverSearch(p.name)}" target="_blank" rel="noopener">${p.name}</a>
      <div class="player-club">${p.club}</div>
      <div class="player-meta">
        <div class="meta-chip age-chip"><span>나이</span>${p.age}</div>
        <div class="meta-chip"><span>키</span>${p.height}cm</div>
      </div>
    `;
    grid.appendChild(card);
  });
  const section = grid.closest('.position-section');
  const countEl = section && section.querySelector('.position-count');
  if (countEl) countEl.textContent = players.length + '명';
}

function renderClubStats(containerId, teamData, accentColor) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const allPlayers = [
    ...teamData.gk,
    ...teamData.df,
    ...(teamData.mf || []),
    ...teamData.fw
  ];
  const counts = {};
  allPlayers.forEach(p => { counts[p.club] = (counts[p.club] || 0) + 1; });
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  container.innerHTML = `
    <div class="club-stats-title">소속팀 현황</div>
    <div class="club-stats-grid">
      ${sorted.map(([club, count]) => `
        <div class="club-stat-row">
          <span class="club-stat-name">${club}</span>
          <span class="club-stat-count" style="color:${accentColor}">${count}명</span>
        </div>`).join('')}
    </div>`;
}
