<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA 2026 북중미 월드컵 조별리그 주요경기 일정</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Barlow+Condensed:wght@400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: #e0ddd5;
    --border-dark: #c8c4b8;
    --text-primary: #1a1917;
    --text-secondary: #6b6860;
    --text-muted: #9e9b92;
    --shaded-bg: #e8f3d8;
    --shaded-text: #3a6b0f;
    --shaded-border: #b8d98a;
    --accent: #1a3a6b;
    --day-header-bg: #1a1917;
    --weekend-bg: #faf9f6;
    --sunday-accent: #c0392b;
    --saturday-accent: #1a3a6b;
    --empty-bg: #f0ede6;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 32px 24px;
  }

  /* ── 헤더 ── */
  .page-header {
    max-width: 1200px;
    margin: 0 auto 28px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .page-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text-primary);
    line-height: 1;
  }

  .page-title span { color: var(--accent); }

  .page-sub {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }

  .nav-btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: var(--day-header-bg);
    color: #fff;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    font-weight: 500;
    text-decoration: none;
    border-radius: 4px;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  .legend {
    display: flex;
    gap: 14px;
    align-items: center;
    font-size: 11px;
    color: var(--text-secondary);
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .legend-item { display: flex; align-items: center; gap: 6px; }

  .legend-swatch-korea {
    width: 22px; height: 10px; border-radius: 2px;
    background: #fce0e0; border: 1px solid #e8a0a0; flex-shrink: 0;
  }
  .legend-swatch-germany {
    width: 22px; height: 10px; border-radius: 2px;
    background: #fdf6c0; border: 1px solid #e0cc50; flex-shrink: 0;
  }
  .legend-swatch-england {
    width: 22px; height: 10px; border-radius: 2px;
    background: #b8e4f9; border: 1px solid #5bbce4; flex-shrink: 0;
  }
  .legend-swatch-france {
    width: 22px; height: 10px; border-radius: 2px;
    background: #c8d4ee; border: 1px solid #7a8fc8; flex-shrink: 0;
  }

  .legend-bold-swatch {
    font-size: 11px; font-weight: 700; color: #b52020;
    white-space: nowrap;
  }

  /* ── 안내문 ── */
  .notice {
    max-width: 1200px;
    margin: 0 auto 14px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 2;
    padding: 10px 14px;
    border-left: 3px solid var(--border-dark);
    background: var(--weekend-bg);
  }

  /* ── 공통 경기 스타일 ── */
  .match-time {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 400;
    display: block;
    margin-bottom: 1px;
  }

  .match-teams {
    font-size: 11.5px;
    font-weight: 400;
    line-height: 1.2;
  }

  /* 찐조국 (한국) - 핑크빨강 */
  .match.shaded-korea { background: #fce0e0; border-left: 2.5px solid #e8a0a0; padding-left: 5px !important; }
  .match.shaded-korea .match-teams { color: #a02020; font-weight: 500; }
  .match.shaded-korea .match-time  { color: #c04040; }

  /* 짭조국 (독일) - 옅은 노랑 */
  .match.shaded-germany { background: #fdf6c0; border-left: 2.5px solid #e0cc50; padding-left: 5px !important; }
  .match.shaded-germany .match-teams { color: #7a6400; font-weight: 500; }
  .match.shaded-germany .match-time  { color: #a08820; }

  /* 짭짭조국1 (잉글랜드) - 하늘색 */
  .match.shaded-england { background: #b8e4f9; border-left: 2.5px solid #5bbce4; padding-left: 5px !important; }
  .match.shaded-england .match-teams { color: #0a527a; font-weight: 500; }
  .match.shaded-england .match-time  { color: #2a7aaa; }

  /* 짭짭조국2 (프랑스) - 옅은 남색 */
  .match.shaded-france { background: #c8d4ee; border-left: 2.5px solid #7a8fc8; padding-left: 5px !important; }
  .match.shaded-france .match-teams { color: #1a2d6b; font-weight: 500; }
  .match.shaded-france .match-time  { color: #3a4f9b; }

  .match.bold .match-teams   { font-weight: 700; color: #b52020; }
  .match.bold .match-time    { color: #c04040; }

  /* ════════════════════════════════
     PC: 달력 뷰
  ════════════════════════════════ */
  .cal-wrapper {
    max-width: 1200px;
    margin: 0 auto;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--border-dark);
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  }

  .cal-head {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: var(--day-header-bg);
  }

  .cal-head-cell {
    padding: 10px 0;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.6);
  }

  .cal-head-cell:first-child { color: rgba(220,100,90,0.85); }
  .cal-head-cell:last-child  { color: rgba(120,160,220,0.85); }

  .cal-body { display: flex; flex-direction: column; }

  .cal-week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-top: 1px solid var(--border);
  }

  .cal-week:first-child { border-top: none; }

  .cal-cell {
    min-height: 130px;
    border-right: 1px solid var(--border);
    background: var(--surface);
    position: relative;
  }

  .cal-cell:last-child { border-right: none; }
  .cal-cell.empty { background: var(--empty-bg); }
  .cal-cell.is-sunday  .cell-date { color: var(--sunday-accent); }
  .cal-cell.is-saturday .cell-date { color: var(--saturday-accent); }

  .cell-date {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 600;
    padding: 8px 10px 4px;
    color: var(--text-secondary);
    line-height: 1;
  }

  .cal-matches {
    padding: 2px 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .cal-matches .match {
    font-size: 11px;
    line-height: 1.3;
    padding: 3px 6px;
    border-radius: 3px;
    color: var(--text-primary);
  }

  /* 모바일 달력 숨김 */
  .list-view { display: none; }

  /* ════════════════════════════════
     모바일: 리스트 뷰
  ════════════════════════════════ */
  @media (max-width: 700px) {
    body { padding: 16px 14px; }

    .page-title { font-size: 26px; }
    .page-sub { font-size: 11px; }

    .page-header { margin-bottom: 16px; }

    .header-right { align-items: flex-start; }
    .nav-btns { justify-content: flex-start; }
    .legend { justify-content: flex-start; }

    .notice { font-size: 11px; line-height: 1.8; }

    /* 달력 숨기고 리스트 표시 */
    .cal-wrapper { display: none; }
    .list-view { display: block; }

    .list-day {
      margin-bottom: 10px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-dark);
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .list-day-header {
      background: var(--day-header-bg);
      padding: 8px 14px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .list-day-date {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
    }

    .list-day-date.sunday { color: #f08070; }
    .list-day-date.saturday { color: #90b8e8; }

    .list-day-weekday {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.04em;
    }

    .list-matches { background: var(--surface); }

    .list-match {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
    }

    .list-match:last-child { border-bottom: none; }

    .list-match .match-time {
      font-size: 11px;
      color: var(--text-muted);
      min-width: 64px;
      flex-shrink: 0;
      margin: 0;
      display: block;
    }

    .list-match .match-teams {
      font-size: 13px;
      flex: 1;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .list-match.shaded-korea .match-teams {
      background: #fce0e0; border-left: 2.5px solid #e8a0a0;
      color: #a02020; font-weight: 500; padding-left: 6px;
    }
    .list-match.shaded-korea .match-time { color: #c04040; }

    .list-match.shaded-germany .match-teams {
      background: #fdf6c0; border-left: 2.5px solid #e0cc50;
      color: #7a6400; font-weight: 500; padding-left: 6px;
    }
    .list-match.shaded-germany .match-time { color: #a08820; }

    .list-match.shaded-england .match-teams {
      background: #b8e4f9; border-left: 2.5px solid #5bbce4;
      color: #0a527a; font-weight: 500; padding-left: 6px;
    }
    .list-match.shaded-england .match-time { color: #2a7aaa; }

    .list-match.shaded-france .match-teams {
      background: #c8d4ee; border-left: 2.5px solid #7a8fc8;
      color: #1a2d6b; font-weight: 500; padding-left: 6px;
    }
    .list-match.shaded-france .match-time { color: #3a4f9b; }

    .list-match.bold .match-teams { font-weight: 700; color: #b52020; }
    .list-match.bold .match-time  { color: #c04040; }
  }

  @media print {
    body { padding: 0; background: white; }
    .cal-wrapper { box-shadow: none; border: 1px solid #ccc; }
    .list-view { display: none !important; }
  }
</style>
</head>

    { time: "오전 11:00", teams: "알제리 vs 오스트리아", type: "" },
    { time: "오전 11:00", teams: "요르단 vs 아르헨티나", type: "" }
  ]
};

const WEEKDAYS = ["일","월","화","수","목","금","토"];

const weeks = [
  [[6,7],[6,8],[6,9],[6,10],[6,11],[6,12],[6,13]],
  [[6,14],[6,15],[6,16],[6,17],[6,18],[6,19],[6,20]],
  [[6,21],[6,22],[6,23],[6,24],[6,25],[6,26],[6,27]],
  [[6,28],[6,29],[6,30],[7,1],[7,2],[7,3],[7,4]]
];

function inRange(m, d) { return m === 6 && d >= 12 && d <= 28; }
function key(m, d) { return m+"/"+d; }

/* ── PC 달력 렌더 ── */
function renderCalendar() {
  const body = document.querySelector('.cal-body');
  body.innerHTML = '';
  weeks.forEach(week => {
    const weekEl = document.createElement('div');
    weekEl.className = 'cal-week';
    week.forEach(([m, d], di) => {
      const cell = document.createElement('div');
      cell.className = 'cal-cell' + (di===0?' is-sunday':'') + (di===6?' is-saturday':'') + (!inRange(m,d)?' empty':'');
      const dateEl = document.createElement('div');
      dateEl.className = 'cell-date';
      dateEl.innerHTML = m===7 ? `<span style="font-size:11px;font-weight:400;color:var(--text-muted)">7/</span>${d}` : `${d}`;
      cell.appendChild(dateEl);
      const matches = MATCHES[key(m,d)] || [];
      if (matches.length) {
        const wrap = document.createElement('div');
        wrap.className = 'cal-matches';
        matches.forEach(mt => {
          const el = document.createElement('div');
          el.className = 'match' + (mt.type ? ' '+mt.type : '');
          el.innerHTML = `<span class="match-time">${mt.time}</span><span class="match-teams">${mt.teams}</span>`;
          wrap.appendChild(el);
        });
        cell.appendChild(wrap);
      }
      weekEl.appendChild(cell);
    });
    body.appendChild(weekEl);
  });
}

/* ── 모바일 리스트 렌더 ── */
function renderList() {
  const container = document.getElementById('list-view');
  container.innerHTML = '';
  // 일정 있는 날짜만 순서대로
  const dates = [];
  weeks.forEach(week => week.forEach(([m,d],di) => {
    if (inRange(m,d) && MATCHES[key(m,d)]) dates.push({m,d,di});
  }));
  dates.forEach(({m,d,di}) => {
    const matches = MATCHES[key(m,d)];
    const dayEl = document.createElement('div');
    dayEl.className = 'list-day';
    const isSun = di===0, isSat = di===6;
    const dateClass = isSun ? 'sunday' : isSat ? 'saturday' : '';
    dayEl.innerHTML = `
      <div class="list-day-header">
        <span class="list-day-date ${dateClass}">${m}월 ${d}일</span>
        <span class="list-day-weekday">${WEEKDAYS[di]}요일</span>
      </div>
      <div class="list-matches">
        ${matches.map(mt => `
          <div class="list-match ${mt.type}">
            <span class="match-time">${mt.time}</span>
            <span class="match-teams">${mt.teams}</span>
          </div>`).join('')}
      </div>`;
    container.appendChild(dayEl);
  });
}

renderCalendar();
renderList();
</script>

</body>
</html>
