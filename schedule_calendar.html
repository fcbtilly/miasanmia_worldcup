<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA 2026 북중미 월드컵 조별리그 주요경기 일정</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Barlow+Condensed:wght@400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: #e0ddd5;
    --border-dark: #c8c4b8;
    --text-primary: #1a1917;
    --text-secondary: #6b6860;
    --text-muted: #9e9b92;
    --shaded-bg: #e8f3d8;
    --shaded-text: #3a6b0f;
    --shaded-border: #b8d98a;
    --bold-color: #1a3a6b;
    --accent: #1a3a6b;
    --day-header-bg: #1a1917;
    --day-header-text: #ffffff;
    --weekend-bg: #faf9f6;
    --sunday-accent: #c0392b;
    --saturday-accent: #1a3a6b;
    --empty-bg: #f0ede6;
    --header-bg: #1a1917;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 32px 24px;
  }

  .page-header {
    max-width: 1200px;
    margin: 0 auto 28px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  .page-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text-primary);
    line-height: 1;
  }

  .page-title span {
    color: var(--accent);
  }

  .page-sub {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .legend {
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 11px;
    color: var(--text-secondary);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-swatch {
    width: 24px;
    height: 10px;
    border-radius: 2px;
    background: var(--shaded-bg);
    border: 1px solid var(--shaded-border);
  }

  .legend-bold-swatch {
    width: 24px;
    height: 10px;
    border-radius: 2px;
    background: transparent;
    border: none;
    font-size: 11px;
    font-weight: 700;
    color: #b52020;
    display: flex;
    align-items: center;
  }

  .cal-wrapper {
    max-width: 1200px;
    margin: 0 auto;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--border-dark);
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  }

  .cal-head {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: var(--day-header-bg);
  }

  .cal-head-cell {
    padding: 10px 0;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
  }

  .cal-head-cell:first-child { color: rgba(220, 100, 90, 0.85); }
  .cal-head-cell:last-child  { color: rgba(120, 160, 220, 0.85); }

  .cal-body {
    display: flex;
    flex-direction: column;
  }

  .cal-week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-top: 1px solid var(--border);
  }

  .cal-week:first-child {
    border-top: none;
  }

  .cal-cell {
    min-height: 130px;
    border-right: 1px solid var(--border);
    padding: 0;
    background: var(--surface);
    vertical-align: top;
    position: relative;
  }

  .cal-cell:last-child { border-right: none; }

  .cal-cell.empty {
    background: var(--empty-bg);
  }

  .cal-cell.is-sunday .cell-date { color: var(--sunday-accent); }
  .cal-cell.is-saturday .cell-date { color: var(--saturday-accent); }

  .cell-date {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 600;
    padding: 8px 10px 4px;
    color: var(--text-secondary);
    line-height: 1;
  }

  .cell-month {
    font-size: 10px;
    font-weight: 400;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    margin-left: 2px;
  }

  .matches {
    padding: 2px 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .match {
    font-size: 11px;
    line-height: 1.3;
    padding: 3px 6px;
    border-radius: 3px;
    color: var(--text-primary);
    background: transparent;
  }

  .match-time {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 400;
    display: block;
    margin-bottom: 1px;
  }

  .match-teams {
    font-size: 11.5px;
    font-weight: 400;
    line-height: 1.2;
  }

  .match.shaded {
    background: var(--shaded-bg);
    border-left: 2.5px solid var(--shaded-border);
    padding-left: 5px;
  }

  .match.shaded .match-teams {
    color: var(--shaded-text);
    font-weight: 500;
  }

  .match.shaded .match-time {
    color: #5a8a28;
  }

  .match.bold .match-teams {
    font-weight: 700;
    color: #b52020;
  }

  .match.bold .match-time {
    color: #c04040;
  }

  /* 날짜 표시 없는 빈 셀 */
  .cell-date.empty-label {
    visibility: hidden;
  }

  @media print {
    body { padding: 0; background: white; }
    .cal-wrapper { box-shadow: none; border: 1px solid #ccc; }
  }
</style>
</head>
<body>

<div class="page-header">
  <div>
    <div class="page-title">FIFA 2026 북중미 <span>월드컵</span></div>
    <div class="page-sub">조별리그 주요경기 일정 · 한국 시간 기준</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px;">
    <a href="groups.html" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--day-header-bg);color:#fff;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;text-decoration:none;border-radius:4px;letter-spacing:0.03em;white-space:nowrap;">⚽ 조편성 보기</a>
    <a href="stadiums.html" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--day-header-bg);color:#fff;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;text-decoration:none;border-radius:4px;letter-spacing:0.03em;white-space:nowrap;">🏟 경기장 현황</a>
    <div class="legend">
      <div class="legend-item">
        <div class="legend-swatch"></div>
        <span>조국의 경기</span>
      </div>
      <div class="legend-item">
        <div class="legend-bold-swatch">빨강</div>
        <span>주목할 만한 경기</span>
      </div>
    </div>
  </div>
</div>

<div class="cal-wrapper">
  <div class="cal-head">
    <div class="cal-head-cell">일</div>
    <div class="cal-head-cell">월</div>
    <div class="cal-head-cell">화</div>
    <div class="cal-head-cell">수</div>
    <div class="cal-head-cell">목</div>
    <div class="cal-head-cell">금</div>
    <div class="cal-head-cell">토</div>
  </div>

  <div class="cal-body">

    <!-- 주 1: 6/8(일)~6/14(토) -->
    <div class="cal-week">
      <!-- 일: 6/8 빈 -->
      <div class="cal-cell is-sunday empty"><div class="cell-date">8<span class="cell-month">일</span></div></div>
      <!-- 월: 6/9 빈 -->
      <div class="cal-cell empty"><div class="cell-date">9</div></div>
      <!-- 화: 6/10 빈 -->
      <div class="cal-cell empty"><div class="cell-date">10</div></div>
      <!-- 수: 6/11 빈 -->
      <div class="cal-cell empty"><div class="cell-date">11</div></div>
      <!-- 목: 6/12 금요일 — 달력상 목은 12일이지만 12일은 금요일. 주 배치: 일~토 기준, 6/8(일)~6/14(토) -->
      <!-- 6/12는 금요일(6번째 열) -->
      <!-- 목: 6/12? No, 6/8=일,9=월,10=화,11=수,12=목... wait 6/8이 무슨 요일인지 계산 필요 -->
      <!-- 6/12 = 금요일 (문제에서 주어짐). 그러면 6/8=월, 하지만 주는 일요일 시작. 
           6/12 금요일이면: 6/8=월,6/9=화...6/7=일. 
           첫 주: 6/7(일)~6/13(토). 6/7 이전은 빈칸.
           실제로 6/12=금, 6/13=토, 6/14=일 -->
      <!-- 재계산: 6/12=금. 주 시작(일)=6/8. 6/8=일,6/9=월,6/10=화,6/11=수,6/12=목?? 
           6/12=금이면 6/11=목, 6/10=수, 6/9=화, 6/8=월, 6/7=일.
           첫 주(일~토): 6/7(일)~6/13(토) -->
      <div class="cal-cell empty"><div class="cell-date">12</div></div>
      <!-- 이 열은 목요일 = 6/12가 금요일이므로 목=6/11, 금=6/12 맞음 -->
      <!-- 다시 올바르게: 6/12=금, 그러므로 첫주 일~토 = 6/8~6/14? 
           6/8: 6/12가 금이면, 금=6, 목=5, 수=4, 화=3, 월=2, 일=1 기준으로
           6/12=금 → 6/9=화, 6/8=월, 6/7=일
           첫 주: 6/7(일)~6/13(토)
           실제 일정 시작 6/12=금 -->
      <!-- 위 셀 재배치는 아래에서 올바르게 -->
      <div class="cal-cell empty"><div class="cell-date">13</div></div>
      <div class="cal-cell is-saturday empty"><div class="cell-date">14<span class="cell-month">일</span></div></div>
    </div>

  </div>
</div>

<script>

// 6/12 = 금요일. 달력: 일~토

// 6/14(일) 6/15(월) ...

  ],

  ],
  "6/17": [
    { time: "오전 04:00", teams: "프랑스 vs 세네갈", type: "" },
    { time: "오전 07:00", teams: "이라크 vs 노르웨이", type: "" },
    { time: "오전 10:00", teams: "아르헨티나 vs 알제리", type: "" },

  ],

  ],
  "6/19": [
    { time: "오전 01:00", teams: "체코 vs 남아공", type: "" },
    { time: "오전 04:00", teams: "스위스 vs 보스니아", type: "" },
    { time: "오전 10:00", teams: "멕시코 vs 한국", type: "shaded" }
  ],
  "6/20": [
    { time: "오전 07:00", teams: "스코틀랜드 vs 모로코", type: "" },
    { time: "오전 09:30", teams: "브라질 vs 아이티", type: "" },
    { time: "오후 12:00", teams: "튀르키예 vs 파라과이", type: "" }
  ],
  "6/21": [
    { time: "오전 02:00", teams: "네덜란드 vs 스웨덴", type: "" },
    { time: "오전 05:00", teams: "독일 vs 코트디부아르", type: "shaded" },
    { time: "오전 09:00", teams: "에콰도르 vs 퀴라소", type: "" },
    { time: "오후 01:00", teams: "튀니지 vs 일본", type: "" }
  ],
  "6/22": [
    { time: "오전 01:00", teams: "스페인 vs 사우디", type: "" },
    { time: "오전 04:00", teams: "벨기에 vs 이란", type: "" },

  ],
  "6/23": [

  ],

    { time: "오전 05:00", teams: "잉글랜드 vs 가나", type: "" },
    { time: "오전 08:00", teams: "파나마 vs 크로아티아", type: "" },
    { time: "오전 11:00", teams: "콜롬비아 vs 콩고", type: "" }
  ],
  "6/25": [
    { time: "오전 04:00", teams: "스위스 vs 캐나다", type: "" },
    { time: "오전 07:00", teams: "모로코 vs 아이티", type: "" },
    { time: "오전 07:00", teams: "스코틀랜드 vs 브라질", type: "" },
    { time: "오전 10:00", teams: "체코 vs 멕시코", type: "" },
    { time: "오전 10:00", teams: "남아공 vs 한국", type: "shaded" }
  ],
  "6/26": [
    { time: "오전 05:00", teams: "퀴라소 vs 코트디부아르", type: "" },
    { time: "오전 05:00", teams: "에콰도르 vs 독일", type: "shaded" },
    { time: "오전 08:00", teams: "일본 vs 스웨덴", type: "bold" },

    { time: "오전 11:00", teams: "튀르키예 vs 미국", type: "" }
  ],
  "6/27": [
    { time: "오전 04:00", teams: "노르웨이 vs 프랑스", type: "bold" },
    { time: "오전 04:00", teams: "세네갈 vs 이라크", type: "" },
    { time: "오전 09:00", teams: "우루과이 vs 스페인", type: "bold" },
    { time: "오후 12:00", teams: "뉴질랜드 vs 벨기에", type: "" }
  ],
  "6/28": [
    { time: "오전 06:00", teams: "크로아티아 vs 가나", type: "" },
    { time: "오전 06:00", teams: "파나마 vs 잉글랜드", type: "" },
    { time: "오전 08:30", teams: "콜롬비아 vs 포르투갈", type: "bold" },
    { time: "오전 11:00", teams: "알제리 vs 오스트리아", type: "" },
    { time: "오전 11:00", teams: "요르단 vs 아르헨티나", type: "" }
  ]
};

// 6/12 = 금요일(5번째, 0=일,1=월,...,5=금,6=토)
// 달력 시작: 6/7(일)로 잡고 6/28(일) 포함 주까지
// 실제로 달력 시작: 6/7(일) ~ 끝: 6/28(일) 포함 주 6/28(일)~7/4(토)

function renderCalendar() {
  const body = document.querySelector('.cal-body');
  body.innerHTML = '';

  // 6/7 = 일요일 (6/12 금요일 기준: 금=6/12, 목=6/11, 수=6/10, 화=6/9, 월=6/8, 일=6/7)
  // 주: 6/7~6/13, 6/14~6/20, 6/21~6/27, 6/28~7/4

  // weeks: 배열로 주별 날짜 정의
  const weeks = [
    // [월, 일] 형태
    [[6,7],[6,8],[6,9],[6,10],[6,11],[6,12],[6,13]],
    [[6,14],[6,15],[6,16],[6,17],[6,18],[6,19],[6,20]],
    [[6,21],[6,22],[6,23],[6,24],[6,25],[6,26],[6,27]],
    [[6,28],[6,29],[6,30],[7,1],[7,2],[7,3],[7,4]]
  ];

  // 일정 있는 날짜 범위: 6/12 ~ 6/28
  const scheduleStart = { m: 6, d: 12 };
  const scheduleEnd = { m: 6, d: 28 };

  function inScheduleRange(m, d) {
    if (m === 6 && d >= 12 && d <= 28) return true;
    return false;
  }

  function getKey(m, d) { return `${m}/${d}`; }

  weeks.forEach(week => {
    const weekEl = document.createElement('div');
    weekEl.className = 'cal-week';

    week.forEach(([m, d], dayIdx) => {
      const cell = document.createElement('div');
      const isSunday = dayIdx === 0;
      const isSaturday = dayIdx === 6;
      const hasSchedule = inScheduleRange(m, d);
      const key = getKey(m, d);
      const matches = MATCHES[key] || [];

      cell.className = 'cal-cell' +
        (isSunday ? ' is-sunday' : '') +
        (isSaturday ? ' is-saturday' : '') +
        (!hasSchedule ? ' empty' : '');

      // 날짜 헤더
      const dateEl = document.createElement('div');
      dateEl.className = 'cell-date';
      const dateLabel = m === 7 ? `<span style="font-size:11px;font-weight:400;color:var(--text-muted)">7/</span>${d}` : `${d}`;
      dateEl.innerHTML = dateLabel;
      cell.appendChild(dateEl);

      // 경기 목록
      if (matches.length > 0) {
        const matchesEl = document.createElement('div');
        matchesEl.className = 'matches';
        matches.forEach(match => {
          const m = document.createElement('div');
          m.className = 'match' + (match.type ? ' ' + match.type : '');
          m.innerHTML = `<span class="match-time">${match.time}</span><span class="match-teams">${match.teams}</span>`;
          matchesEl.appendChild(m);
        });
        cell.appendChild(matchesEl);
      }

      weekEl.appendChild(cell);
    });

    body.appendChild(weekEl);
  });
}

renderCalendar();
</script>

</body>
</html>
